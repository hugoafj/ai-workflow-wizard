name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple

  update-pr-with-ai:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate AI summary and comment on PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
          PR_BODY=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['body'])")
          SUMMARY=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg text "Resumí estos cambios para humanos, en español, resaltando beneficios para el usuario final. Mantené el formato Markdown.\n\n${PR_BODY}" \
              '{contents:[{parts:[{text:$text}]}]}')" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['candidates'][0]['content']['parts'][0]['text'])" 2>/dev/null \
            || echo "_No se pudo generar el resumen automático._")

          if [ -n "$SUMMARY" ] && [ "$SUMMARY" != "_No se pudo generar el resumen automático._" ]; then
            COMMENT=$(printf "## 🤖 Resumen sugerido por IA\n\n%s\n\n---\n*Revisá este texto antes de mergear. Lo que quede acá va a ser parte del release oficial.*" "${SUMMARY}")
            gh pr comment "${PR_NUMBER}" --body "$COMMENT"
          fi

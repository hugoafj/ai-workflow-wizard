name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  update-manifest:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout release-please PR branch
        env:
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
          PR_HEAD_REF=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['headRefName'])")
          git fetch origin "$PR_HEAD_REF"
          git checkout "$PR_HEAD_REF"

      - name: Regenerate manifest
        run: |
          CURRENT_VERSION=$(cat VERSION | xargs)
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0-beta.1")

          python3 << 'PYTHON_SCRIPT'
          import json
          import subprocess
          import os
          import hashlib
          from pathlib import Path

          CURRENT_VERSION = "$(cat VERSION | xargs)"
          PREV_TAG = "$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.1.0-beta.1')"
          GENERATED_AT = subprocess.check_output(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]).decode().strip()

          manifest = {
              "version": CURRENT_VERSION,
              "description": "Wizard manifest (versioned): files, changes, templates, and regeneration requirements",
              "generated_at": GENERATED_AT,
              "schema": {
                  "content_hash": "SHA256 of file content for change detection",
                  "deleted": "Mark files that existed in previous version but not in current",
                  "state_mappings": "Maps simple placeholder names to full .wizard-state.json paths"
              },
              "files": {}
          }

          result = subprocess.check_output(["git", "ls-files"]).decode()
          all_files = [f for f in result.split('\n') if f and any(x in f for x in ['templates/', 'wf-init/', 'post-commit', 'VERSION'])]

          try:
              changed_result = subprocess.check_output(["git", "diff", f"{PREV_TAG}..HEAD", "--name-only"], stderr=subprocess.DEVNULL).decode()
              changed_files = set(changed_result.split('\n'))
          except:
              changed_files = set()

          try:
              deleted_result = subprocess.check_output(["git", "diff", f"{PREV_TAG}..HEAD", "--name-only", "--diff-filter=D"], stderr=subprocess.DEVNULL).decode()
              deleted_files = set(deleted_result.split('\n'))
          except:
              deleted_files = set()

          for file_path in sorted(all_files):
              if not file_path or os.path.isdir(file_path):
                  continue

              status = "changed" if file_path in changed_files else "unchanged"

              try:
                  with open(file_path, 'rb') as f:
                      content = f.read()
                      content_hash = hashlib.sha256(content).hexdigest()
              except:
                  content_hash = None

              regenerate = False
              template = None
              state_vars = []
              state_mappings = {}
              output = None
              file_type = "static"

              if file_path.startswith("templates/protocols/"):
                  file_type = "protocol"
                  template = file_path
                  regenerate = status == "changed"
              elif file_path.startswith("templates/commands/"):
                  file_type = "command"
                  template = file_path
                  try:
                      with open(file_path) as f:
                          content = f.read()
                          if "{{" in content:
                              regenerate = True
                              import re
                              vars_found = re.findall(r'\{\{([^}]+)\}\}', content)
                              state_vars = sorted(set(v for v in vars_found if v and not v.startswith('/') and len(v) < 50))
                  except:
                      pass
                  cmd_name = file_path.split('/')[2]
                  output = f".claude/commands/{cmd_name}.md"
              elif file_path.startswith(".github/workflows/"):
                  file_type = "workflow"
                  output = file_path
                  try:
                      with open(file_path) as f:
                          if "{{" in f.read():
                              regenerate = True
                  except:
                      pass
                  if "release-please.yml" in file_path:
                      template = "templates/protocols/cicd/variants/release-please.yml.md"
                      state_vars = ["ci.release_please", "ci.conventional_commits", "ci.release_ai_summary", "ci.release_ai_provider", "answers.project_name"]
                      state_mappings = {
                          "trigger_event": "cd.trigger",
                          "release_ai_summary": "ci.release_ai_summary",
                          "release_ai_provider": "ci.release_ai_provider"
                      }
                  elif "ci.yml" in file_path:
                      template = "templates/protocols/cicd/variants/ci.yml.md"
                      state_vars = ["ci.quality_guard", "ci.ai_review", "ci.security_scan", "discovery.stack_key"]
              elif file_path == "post-commit":
                  file_type = "hook"
                  output = ".git/hooks/post-commit"
              elif file_path == "VERSION":
                  file_type = "metadata"

              key = Path(file_path).name
              manifest["files"][key] = {
                  "version": CURRENT_VERSION,
                  "type": file_type,
                  "path": file_path,
                  "output": output,
                  "status": status,
                  "regenerate": regenerate,
                  "template": template,
                  "state_vars": state_vars,
                  "state_mappings": state_mappings if state_mappings else None,
                  "content_hash": content_hash
              }

          if deleted_files:
              manifest["_deleted_files"] = {
                  "note": "Files that existed in the previous release but were removed",
                  "files": sorted([f for f in deleted_files if f])
              }

          manifest_filename = f"WIZARD_MANIFEST-{CURRENT_VERSION}.json"
          with open(manifest_filename, "w") as f:
              json.dump(manifest, f, indent=2)

          with open("WIZARD_MANIFEST.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print(f"✓ Generated {manifest_filename}")
          PYTHON_SCRIPT

      - name: Commit manifest to release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CURRENT_VERSION=$(cat VERSION | xargs)
          MANIFEST_FILE="WIZARD_MANIFEST-${CURRENT_VERSION}.json"

          git add "$MANIFEST_FILE" WIZARD_MANIFEST.json

          if ! git diff --quiet --cached; then
            COMMIT_MSG=$(printf 'chore: regenerate WIZARD_MANIFEST-%s.json' "$CURRENT_VERSION")
            git commit -m "$COMMIT_MSG"
            git push origin HEAD
            echo "✓ Manifest added to release PR"
          else
            echo "✓ Manifest already up to date"
          fi

  update-pr-with-ai:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate AI summary and comment on PR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
          PR_BODY=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['body'])")
          SUMMARY=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg text "Summarize these changes for humans in English, highlighting benefits for the end user. Keep the Markdown format.\n\n${PR_BODY}" \
              '{contents:[{parts:[{text:$text}]}]}')" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['candidates'][0]['content']['parts'][0]['text'])" 2>/dev/null \
            || echo "_Could not generate automatic summary._")

          if [ -n "$SUMMARY" ] && [ "$SUMMARY" != "_Could not generate automatic summary._" ]; then
            COMMENT=$(printf "## 🤖 AI Suggested Summary\n\n%s\n\n---\n*Review this text before merging. What remains here will be part of the official release.*" "${SUMMARY}")
            gh pr comment "${PR_NUMBER}" --body "$COMMENT"
          fi
